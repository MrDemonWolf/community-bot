name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, unit tests, and application builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        # Non-secret build fixtures. Keep runtime validation enabled; no live
        # database or production credentials are required to compile the app.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/community_bot_build
          BETTER_AUTH_SECRET: ci-build-only-placeholder-0000000000000000
          BETTER_AUTH_URL: http://127.0.0.1:3001
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OWNER_EMAIL: ci@example.invalid
        run: bun run build

      - name: Upload static documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: apps/docs/out/
          if-no-files-found: error
          retention-days: 7

  docker-e2e:
    name: Docker browser and PostgreSQL integration
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: community-bot-e2e
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
      POSTGRES_PASSWORD: disposable-ci-password
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BETTER_AUTH_SECRET: disposable-ci-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      OWNER_EMAIL: ci@example.invalid
      COMPOSE_PARALLEL_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Build production workers, production web, development web, and browser image
        run: |
          for service in migrate web production-web discord twitch e2e; do
            docker compose --parallel 1 build "$service"
          done
      - name: Start isolated stack and run incremental migrations
        run: docker compose up -d --wait --wait-timeout 300 web production-web
      - name: PostgreSQL constraints and feature queue invariants
        run: |
          docker compose exec -T postgres psql -U community_bot -d community_bot -v ON_ERROR_STOP=1 -q -t < packages/db/tests/constraints.sql
          docker compose exec -T postgres psql -U community_bot -d community_bot -v ON_ERROR_STOP=1 -q -t < packages/db/tests/features.sql
      - name: Permission isolation and identity nonce integration
        run: docker compose run --rm --no-deps -e ACCESS_TEST=true -e NODE_ENV=development migrate bun tests/access.integration.ts
      - name: Redemption queue and concurrent action integration
        run: docker compose run --rm --no-deps -e REWARDS_TEST=true -e NODE_ENV=development migrate bun tests/e2e/rewards.integration.ts
      - name: Mocked Channel Points authorization and manual action integration
        run: docker compose run --rm --no-deps -e REWARDS_TEST=true -e NODE_ENV=development migrate bun tests/rewards.integration.ts
      - name: Worker reward actions with all provider traffic mocked
        run: docker compose run --rm --no-deps migrate bun tests/e2e/reward-runtime.integration.ts
      - name: Start real paused worker images after disposable provider fixtures are restored
        run: docker compose up -d --wait --wait-timeout 180 discord twitch
      - name: Browser journeys with real local authentication cookies
        run: docker compose run --rm --no-deps e2e
      - name: Browser fixture secret is encrypted at rest and workers stay paused
        run: docker compose exec -T postgres psql -U community_bot -d community_bot -v ON_ERROR_STOP=1 -q -f - < tests/e2e/encryption.sql
      - name: Worker source synchronization and independent restart
        run: bun tests/e2e/watch.integration.ts
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable stack and database volume
        if: always()
        run: docker compose down --volumes --remove-orphans
