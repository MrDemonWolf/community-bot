name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      - name: Build
        # Non-secret build fixtures. Keep runtime validation enabled; no live
        # database or production credentials are required to compile the app.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/community_bot_build
          BETTER_AUTH_SECRET: ci-build-only-placeholder-0000000000000000
          BETTER_AUTH_URL: http://127.0.0.1:3001
          CORS_ORIGIN: http://127.0.0.1:3001
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: bun run build
